<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Swipe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="setup-screen" class="screen active">
        <h2 class="neon-text">RANGE SETUP</h2>
        <div class="input-group">
            <input type="number" id="min-val" value="1"> 
            <span class="neon-text">TO</span>
            <input type="number" id="max-val" value="10">
        </div>
        <button class="btn-neon" onclick="startGame()">START GAME</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="pause-btn" onclick="togglePause()">⏸</div>
        <div id="progress" class="neon-text-small">READY...</div>
        
        <div id="card-container">
            <div id="card">
                <div id="card-inner">
                    <div class="card-face card-front" id="card-front">0</div>
                    <div class="card-face card-back" id="card-back">Thinking...</div>
                </div>
            </div>
        </div>
        
        <div class="hint">TAP TO FLIP / SWIPE TO NEXT</div>
    </div>

    <div id="pause-modal" class="modal">
        <div class="modal-content">
            <h3 class="neon-text">PAUSED</h3>
            <button onclick="togglePause()" class="btn-neon">RESUME</button>
            <button onclick="finishGame()" class="btn-neon btn-danger">FINISH</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2 class="neon-text">RESULT</h2>
        <div class="stats">
            <div class="stats-label">CHECKED RATE</div>
            <div class="stat-big neon-text-blue" id="result-percent">0%</div>
            <p>CHECKED / TOTAL: <span id="result-fraction">0/0</span></p>
        </div>
        
        <div class="list-wrapper">
            <div class="list-box" id="left-list"></div>
        </div>
        
        <div class="footer-btn">
            <button class="btn-neon" onclick="location.reload()">RETRY</button>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
