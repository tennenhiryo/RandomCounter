<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金フレ全暗記 Swipe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<button id="theme-toggle" onclick="toggleTheme()">🌙</button>

<div class="container">
    <div id="setup-screen" class="screen active">
        <h2>金フレ範囲設定</h2>
        <div class="input-group">
            <input type="number" id="min-val" value="1"> 
            <span>〜</span>
            <input type="number" id="max-val" value="10">
        </div>
        <button class="btn-primary" onclick="startGame()">スタート</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="pause-btn" onclick="togglePause()">⏸</div>
        <div id="progress">準備中...</div>
        
        <div id="card-container">
            <div id="card">
                <div id="card-inner">
                    <div class="card-face card-front" id="card-front">0</div>
                    <div class="card-face card-back" id="card-back">Thinking...</div>
                </div>
            </div>
        </div>
        
        <div class="hint">タップで正解を確認 / 左右へスワイプ</div>
    </div>

    <div id="pause-modal" class="modal">
        <div class="modal-content">
            <h3>一時停止中</h3>
            <button onclick="togglePause()" class="btn-resume">再開する</button>
            <button onclick="finishGame()" class="btn-quit">中断して結果を見る</button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <h2>学習終了</h2>
        <div class="stats">
            <div class="stats-label">チェック(左)した割合</div>
            <div class="stat-big" id="result-percent">0%</div>
            <p>チェック数 / 実施数: <span id="result-fraction">0/0</span></p>
        </div>
        
        <h3>チェックした番号</h3>
        <div class="list-wrapper">
            <div class="list-box" id="left-list"></div>
        </div>
        
        <div class="footer-btn">
            <button class="btn-primary" onclick="location.reload()">もう一度</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
