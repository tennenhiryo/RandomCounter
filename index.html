<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Swipe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="setup-screen" class="screen active">
        <h2>範囲設定</h2>
        <div class="input-group">
            <input type="number" id="min-val" value="1"> 
            <span>〜</span>
            <input type="number" id="max-val" value="10">
        </div>
        <button onclick="startGame()">スタート</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="progress">準備中...</div>
        <div id="card-container">
            <div id="card">0</div>
        </div>
        <div class="hint">← 左へスワイプ / 右へスワイプ →</div>
    </div>

    <div id="result-screen" class="screen">
        <h2>試合終了</h2>
        <div class="stats">
            <div class="stats-label">左にスワイプした割合</div>
            <div class="stat-big" id="result-percent">0%</div>
            <p>左の数 / 全体: <span id="result-fraction">0/0</span></p>
        </div>
        <h3>左に選んだ数字</h3>
        <div class="list-box" id="left-list"></div>
        <button onclick="location.reload()">もう一度</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
